# Insert inside the existing stage.qiongyintech.com server block.
# This is a fragment, not a replacement for the complete website configuration.
# Keep the existing root, TLS, HTTPS redirect, ACME and
# proxy_set_header X-Forwarded-Proto https directives unchanged.

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header Connection "";
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;
proxy_set_header Forwarded "";
proxy_connect_timeout 5s;
proxy_read_timeout 30s;
proxy_send_timeout 30s;
proxy_cache off;
proxy_intercept_errors off;
add_header Referrer-Policy "no-referrer" always;

# The current login redirect uses /?loginTicket=..., not a URL fragment.
# Serve index.html in this location without an index-module redirect.
location = / {
    try_files /index.html =404;
    access_log off;
}

location = /index.html {
    access_log off;
}

location ^~ /api/v1/customer/ {
    # No trailing slash: preserve the complete backend request path.
    proxy_pass http://127.0.0.1:8888;
    access_log off;
}

location ^~ /api/v1/h5/auth/ {
    proxy_pass http://127.0.0.1:8888;
    # OAuth callbacks contain temporary codes; do not log their query strings.
    access_log off;
}

location = /api {
    return 404;
}

location ^~ /api/ {
    return 404;
}

location ~ ^/(actuator|swagger-ui|swagger-resources|v2/api-docs|v3/api-docs)(/|$) {
    return 404;
}

location = /swagger-ui.html {
    return 404;
}
