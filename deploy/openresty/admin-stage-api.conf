# Insert ONCE inside the existing admin-stage.qiongyintech.com server block.
# This is a fragment, not a replacement for the complete website configuration.
# Keep the site's root, TLS, HTTP redirect, ACME and existing hidden-file rules.
# Keep exactly one proxy_set_header X-Forwarded-Proto https at server level.
# Do NOT insert this fragment into the consumer stage.qiongyintech.com site.

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header Connection "";
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;
proxy_set_header Forwarded "";
proxy_connect_timeout 5s;
proxy_read_timeout 60s;
proxy_send_timeout 60s;
proxy_cache off;
proxy_intercept_errors off;
# Never automatically replay a financial request against another upstream.
proxy_next_upstream off;
add_header Referrer-Policy "no-referrer" always;

# Hash routing only needs the homepage, not a catch-all API-to-HTML fallback.
# Avoid retaining an old entry/config after a release. Do not add response
# headers inside these locations, which would override server-level HSTS.
location = / {
    try_files /index.html =404;
    expires -1;
}

location = /index.html {
    expires -1;
}

location = /_app.config.js {
    try_files $uri =404;
    expires -1;
}

location ^~ /api/v1/admin/ {
    # No trailing slash: preserve /api/v1/admin/ in the backend request path.
    proxy_pass http://127.0.0.1:8888;
    # Queries can contain customer phone numbers; backend auditing stays active.
    access_log off;
}

location = /api {
    return 404;
}

# Do not expose consumer/OAuth/legacy endpoints on the admin hostname.
location ^~ /api/ {
    return 404;
}

location ~ ^/(actuator|swagger-ui|swagger-resources|v2/api-docs|v3/api-docs)(/|$) {
    return 404;
}

location = /swagger-ui.html {
    return 404;
}
