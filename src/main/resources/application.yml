server:
  port: ${SERVER_PORT:8888}

spring:
  datasource:
    driver-class-name: ${DB_DRIVER:com.p6spy.engine.spy.P6SpyDriver}
    url: ${DB_URL:jdbc:p6spy:mysql://127.0.0.1:3306/core_boot?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&rewriteBatchedStatements=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PWD:123456}

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml

mybatis-plus:
  global-config:
    db-config:
      table-prefix: t_
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  packages-to-scan: com.core.coreboot
  swagger-ui:
    defaultModelsExpandDepth: -1
    defaultModelExpandDepth: 10
    tags-sorter: alpha

upload:
  file:
    path: ./upload/files/
  image:
    path: ./upload/images/

qrcode:
  generate:
    path: ./upload/qrcode/
    ip: 127.0.0.1
